[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://api.lunest.app/v1/:splat"
  status = 200
  force = true
  signed = false
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS", Access-Control-Allow-Headers = "Content-Type, Authorization", Cache-Control = "no-cache"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
